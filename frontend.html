<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot helpdesk</title>
    <link rel="stylesheet" href="interface.css">
</head>
<body>

    <header>
        <h1>Chatbot helpdesk</h1>
    </header>

    <div id="chat-history">
        <div class="message ai-message"><b>AI:</b> Hello! I'm here to help you. What can I do for you?</div>
    </div>

    <div id="loader" style="display: none; text-align: center; padding: 10px; color: #6d28d9; font-style: italic;">AI is thinking...</div>

    <div class="input-container">
        <form id="chat-form">
            <label for="file-input" class="file-label">+</label>
            <input type="file" id="file-input" accept="image/*,application/pdf" style="display: none;">
            <input type="text" id="user-input" placeholder="Type here..." required autocomplete="off">
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const historyDiv = document.getElementById('chat-history');
        const loader = document.getElementById('loader');
        const fileInput = document.getElementById('file-input');

        let chatHistory = [{"role": "system", "content": "You act as a college helpdesk."}];

        form.onsubmit = async (e) => {
            e.preventDefault();
            const text = document.getElementById('user-input').value;
            const file = fileInput.files[0];
            
            historyDiv.innerHTML += `<div class="message user-message"><b>You:</b> ${text}</div>`;
            document.getElementById('user-input').value = '';
            loader.style.display = 'block';
            historyDiv.scrollTop = historyDiv.scrollHeight;

            const formData = new FormData();
            formData.append('message', text);
            formData.append('history', JSON.stringify(chatHistory));
            if (file) formData.append('file', file);

            const RENDER_URL = 'https://chatbothelpdesk-main.onrender.com/chat';
            const LOCAL_URL = 'http://127.0.0.1:8000/chat';

            let res;
            try {
                console.log("Attempting to connect to Render...");
                res = await fetch(RENDER_URL, { method: 'POST', body: formData });
                
                if (!res.ok) throw new Error('Render failed');
            } catch (error) {
                console.warn("Render unavailable, falling back to Localhost...");
                try {
                    res = await fetch(LOCAL_URL, { method: 'POST', body: formData });
                } catch (localError) {
                    console.error("Both backends failed.");
                }
            }

            try {
                if (res && res.ok) {
                    const data = await res.json();
                    chatHistory.push({"role": "user", "content": text});
                    chatHistory.push({"role": "assistant", "content": data.response});
                    historyDiv.innerHTML += `<div class="message ai-message"><b>AI:</b> ${data.response}</div>`;
                } else {
                    throw new Error("No response from any server");
                }
            } catch (error) {
                historyDiv.innerHTML += `<div class="message ai-message" style="color: red;"><b>AI:</b> Connection failed. Ensure your backend is running.</div>`;
            } finally {
                loader.style.display = 'none';
                fileInput.value = ''; 
                historyDiv.scrollTop = historyDiv.scrollHeight;
            }
        };
        fileInput.onchange = () => {
            if (fileInput.files.length > 0) {
                alert("File selected: " + fileInput.files[0].name);
            }
        };
    </script>
</body>
</html>
